services:
  postgres:
    image: postgres:16
    container_name: appparque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appparque}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - appparque-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appparque}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./AppParque.Api
      dockerfile: Dockerfile
    container_name: appparque-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-appparque};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      # Clave de firma JWT: el valor de abajo es SOLO para desarrollo local. En producción,
      # definir JWT_KEY en un .env real (no versionado) con un secreto propio — ver .env.example.
      Jwt__Key: ${JWT_KEY:-UbTZ8fXRwsCthDrip15QxXIl7KVpq4jaJ2F/4tq4Sw40zxAvzR12LZYDhpyQJmVD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  appparque-postgres-data:
